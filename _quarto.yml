project:
  type: website
  output-dir: _site
  render:
    - index.qmd
    - presentation.qmd
    - presentation_en.qmd
    - scripts/birdnet_acoustic_data_prep.qmd
    - scripts/birdnet_model_fitting.qmd
    - scripts/statistical_analysis.qmd
    - scripts/statistical_analysis_cv.qmd
  resources:
    - presentation/presentation.html
    - presentation/presentation_en.html

execute:
  freeze: auto

website:
  title: "Bellbird vocal mimicry"
  site-url: https://marce10.github.io/bellbird_vocal_mimicry/
  repo-url: https://github.com/maRce10/bellbird_vocal_mimicry
  page-navigation: true
  navbar:
    background: "#ffffff"
    foreground: "#408AB4"
    left:
      - href: index.qmd
        text: Home
      - href: scripts/birdnet_acoustic_data_prep.qmd
        text: Data preparation
      - href: scripts/birdnet_model_fitting.qmd
        text: Model fitting
      - text: Statistical analysis
        menu:
          - href: scripts/statistical_analysis.qmd
            text: GUI classifiers
          - href: scripts/statistical_analysis_cv.qmd
            text: Cross-validated classifiers
      - text: Presentation
        menu:
          - href: presentation_en.qmd
            text: English
          - href: presentation.qmd
            text: Spanish
    right:
      - icon: github
        href: https://github.com/maRce10/bellbird_vocal_mimicry
        aria-label: GitHub repository

format:
  html:
    theme: cosmo
    lang: en
    css: styles.css
    include-after-body: _figure-download.html
