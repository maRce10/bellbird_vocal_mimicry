project:
  type: website
  output-dir: _site
  render:
    - index.qmd
    - presentation.qmd
    - presentation_en.qmd
    - scripts/birdnet_acoustic_data_prep.qmd
    - scripts/birdnet_model_fitting.qmd
    - scripts/statistical_analysis_cv.qmd
    - media.qmd
  resources:
    - presentation/presentation.html
    - presentation/presentation_en.html
    - presentation/images/mimic_campana.mp4
    - presentation/images/mimic_aracari.mp4
    - presentation/images/hanging_with_models_web.mp4
    - presentation/images/mimetic_and_toucan.mp4
    - presentation/images/focal_spectrogram_black_en.mp4
    - presentation/images/adult_bellbird_spectrogram_short_black_en.mp4
    - presentation/images/adulto_monteverde.mp4

execute:
  freeze: auto

website:
  title: "Bellbird vocal mimicry"
  site-url: https://marce10.github.io/bellbird_vocal_mimicry/
  repo-url: https://github.com/maRce10/bellbird_vocal_mimicry
  page-navigation: true
  navbar:
    background: "#ffffff"
    foreground: "#408AB4"
    left:
      - href: index.qmd
        text: Home
      - href: scripts/birdnet_acoustic_data_prep.qmd
        text: Data preparation
      - href: scripts/birdnet_model_fitting.qmd
        text: Model fitting
      - href: scripts/statistical_analysis_cv.qmd
        text: Statistical analysis
      - href: media.qmd
        text: Videos and images
      - text: Presentation
        menu:
          - href: presentation_en.qmd
            text: English
          - href: presentation.qmd
            text: Spanish
    right:
      - icon: github
        href: https://github.com/maRce10/bellbird_vocal_mimicry
        aria-label: GitHub repository

format:
  html:
    theme: cosmo
    lang: en
    css: styles.css
    include-after-body: _figure-download.html
